<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/submit-conference" method="POST">
  
  <!-- 1. Personal Information Section -->
  <fieldset>
    <legend>Personal Information</legend>
    
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" required>
    
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" title="Fadlan geli iimayl sax ah" required>
    
    <label for="phone">Contact Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="+252 61 XXX XXXX">
  </fieldset>

  <!-- 2. Conference Details Section -->
  <fieldset>
    <legend>Conference Details</legend>
    
    <p>Preferred Day(s) of Attendance:</p>
    <label><input type="checkbox" name="days" value="day1"> Day 1</label>
    <label><input type="checkbox" name="days" value="day2"> Day 2</label>
    <label><input type="checkbox" name="days" value="day3"> Day 3</label>
    
    <p>Type of Attendance:</p>
    <label><input type="radio" name="attendance_type" value="virtual" required> Virtual</label>
    <label><input type="radio" name="attendance_type" value="in_person"> In-person</label>
    
    <br><br>
    <label for="tshirt">T-shirt Size:</label>
    <select id="tshirt" name="tshirt">
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="XXL">XXL</option>
    </select>
  </fieldset>

  <!-- 3. Sessions of Interest Section -->
  <fieldset>
    <legend>Sessions of Interest</legend>
    <label><input type="checkbox" name="interests" value="web_dev"> Web Development</label>
    <label><input type="checkbox" name="interests" value="data_science"> Data Science</label>
    <label><input type="checkbox" name="interests" value="cloud"> Cloud Computing</label>
    <label><input type="checkbox" name="interests" value="cybersecurity"> Cybersecurity</label>
    <label><input type="checkbox" name="interests" value="ai_ml"> AI & Machine Learning</label>
  </fieldset>

  <!-- 4. Dietary Preferences Section -->
  <fieldset>
    <legend>Dietary Preferences</legend>
    <label><input type="checkbox" name="diet" value="vegetarian"> Vegetarian</label>
    <label><input type="checkbox" name="diet" value="vegan"> Vegan</label>
    <label><input type="checkbox" name="diet" value="gluten_free"> Gluten-Free</label>
    <label><input type="checkbox" name="diet" value="no_restrictions"> No Restrictions</label>
  </fieldset>

  <!-- 5. Additional Comments Section -->
  <fieldset>
    <legend>Additional Comments</legend>
    <label for="comments">Any additional requirements or questions:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="50"></textarea>
  </fieldset>

  <!-- 6. Consent Section -->
  <fieldset>
    <legend>Consent</legend>
    <label>
      <input type="checkbox" name="consent" value="yes" required> 
      Waxaan ogolahay in iimayl lagugu soo diro wixii warar cusub ah.
    </label>
  </fieldset>

  <!-- 7. Submit Button -->
  <br>
  <button type="submit">Submit Registration</button>
</form>
</body>
</html>
